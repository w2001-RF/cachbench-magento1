[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cachebench"
version = "0.1.0"
description = "Benchmark d'algorithmes de cache pilotés par l'IA, appliqué à Magento"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Le code officiel de cacheus importe matplotlib au chargement.
official = ["matplotlib>=3.5"]

[project.scripts]
cachebench = "cachebench.cli:main"

[tool.setuptools.packages.find]
include = ["cachebench*"]

[tool.setuptools.package-data]
"cachebench.ui" = ["static/*"]
